<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="La meilleure et la plus simple bibliothèque numérique au monde"
    />

    <title>Ma Bibliothèque</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Ma Bibliothèque</h1>
      <p>Gérez votre collection de livres facilement.</p>
    </header>

    <main>
      <section class="form-section">
        <h2 id="form-title">Ajouter un livre</h2>

        <form id="book-form">
          <input type="hidden" id="book-id" />

          <div class="form-group">
            <label for="title">Titre du livre *</label>

            <input
              type="text"
              id="title"
              required
              placeholder="Exemple : Le Petit Prince"
            />
          </div>

          <div class="form-group">
            <label for="author">Auteur *</label>

            <input
              type="text"
              id="author"
              required
              placeholder="Nom de l'auteur"
            />
          </div>

          <div class="form-group">
            <label for="year">Année de publication</label>

            <input
              type="number"
              id="year"
              min="1"
              max="9999"
              placeholder="Exemple : 1943"
            />
          </div>

          <div class="form-group">
            <label for="genre">Genre</label>

            <input type="text" id="genre" placeholder="Exemple : Roman" />
          </div>

          <div class="form-group">
            <label for="description">Description</label>

            <textarea
              id="description"
              rows="3"
              placeholder="Quelques informations sur le livre"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="status">Statut de lecture</label>

            <select id="status">
              <option value="to-read">À lire</option>
              <option value="reading">En cours</option>
              <option value="read">Lu</option>
            </select>
          </div>

          <button type="submit" id="submit-button">Ajouter le livre</button>

          <button
            type="button"
            id="cancel-button"
            class="secondary-button"
            hidden
          >
            Annuler
          </button>
        </form>
      </section>

      <section class="library-section">
        <h2>Ma collection</h2>

        <div class="tools">
          <input
            type="search"
            id="search"
            placeholder="Rechercher un titre ou un auteur..."
          />

          <select id="sort">
            <option value="title">Trier par titre</option>
            <option value="author">Trier par auteur</option>
            <option value="year">Trier par année</option>
          </select>
        </div>

        <p id="book-count">0 livre(s)</p>

        <div id="book-list" class="book-list"></div>
      </section>
    </main>

    <footer>
      <p>Ma Bibliothèque — Gestion de livres</p>
      <p><b>Copyright © 2026 Ma Bibliothèque</b></p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
